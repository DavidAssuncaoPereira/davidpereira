<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - David Pereira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="loading-screen" id="loading">
    <div class="loader">
        <div class="spinner"></div>
        <h2>David Pereira</h2>
    </div>
</div>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="logo">
            <span class="logo-text">David</span><span class="logo-highlight">Pereira</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Início</a></li>
            <li><a href="about.html" class="nav-link">Sobre</a></li>
            <li><a href="skills.html" class="nav-link">Habilidades</a></li>
            <li><a href="projects.html" class="nav-link active">Projetos</a></li>
            <li><a href="contact.html" class="nav-link">Contacto</a></li>
            <li>
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </li>
        </ul>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
    <ul>
        <li><a href="index.html" class="mobile-nav-link">Início</a></li>
        <li><a href="about.html" class="mobile-nav-link">Sobre</a></li>
        <li><a href="skills.html" class="mobile-nav-link">Habilidades</a></li>
        <li><a href="projects.html" class="mobile-nav-link active">Projetos</a></li>
        <li><a href="contact.html" class="mobile-nav-link">Contacto</a></li>
    </ul>
</div>

<section id="projects" class="projects">
    <div class="container">
        <div class="section-header">
            <h2>Meus <span class="highlight">Projetos</span></h2>
            <p class="section-subtitle">Alguns dos trabalhos que desenvolvi</p>
        </div>
        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be loaded here -->
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-logo">
                <span class="logo-text">David</span><span class="logo-highlight">Pereira</span>
            </div>
            <p class="footer-text">Sempre a aprender!</p>
            <div class="footer-bottom">
                <p>&copy; <span id="current-year"></span> David Assunção Pereira.</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="script.js"></script>
<script>
    async function loadProjects() {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';

        if (projects.length === 0) {
            grid.innerHTML = '<p class="text-center">Ainda não há projetos para mostrar.</p>';
            return;
        }

        projects.forEach(p => {
            const techs = p.technologies ? p.technologies.split(',').map(t => `<span class="tech-tag">${t.trim()}</span>`).join('') : '';
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <div class="project-image">
                    <img src="${p.image_url || 'https://via.placeholder.com/400x250'}" alt="${p.title}" loading="lazy">
                    <div class="project-overlay">
                        ${p.demo_url ? `<a href="${p.demo_url}" class="project-link" target="_blank" rel="noopener noreferrer"><i class="fas fa-link"></i></a>` : ''}
                    </div>
                </div>
                <div class="project-content">
                    <h3>${p.title}</h3>
                    <p>${p.description || ''}</p>
                    <div class="project-tech">${techs}</div>
                    <div class="project-links">
                        ${p.github_url ? `<a href="${p.github_url}" class="project-github" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> Código</a>` : ''}
                        ${p.demo_url ? `<a href="${p.demo_url}" class="project-demo" target="_blank" rel="noopener noreferrer"><i class="fas fa-external-link-alt"></i> Demo</a>` : ''}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    loadProjects();
</script>
</body>
</html>
