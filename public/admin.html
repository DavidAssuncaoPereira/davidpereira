<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - David Pereira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .admin-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: 600px;
            overflow-y: auto;
        }
        .admin-card h3 {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        .contact-item, .chat-user-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .contact-item:hover, .chat-user-item:hover {
            background: var(--bg-color);
        }
        .chat-window {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 400px;
            height: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }
        .chat-window-header {
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: flex;
            justify-content: space-between;
        }
        .chat-window-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .chat-window-input {
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-text">David</span><span class="logo-highlight">Pereira</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Início</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-container">
        <div class="section-header">
            <h2>Painel de <span class="highlight">Administração</span></h2>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <h3><i class="fas fa-envelope"></i> Contactos Recebidos</h3>
                <div id="contactsList"></div>
            </div>
            <div class="admin-card">
                <h3><i class="fas fa-comments"></i> Conversas Ativas</h3>
                <div id="usersList"></div>
            </div>
        </div>
    </div>

    <div id="adminChatWindow" class="chat-window">
        <div class="chat-window-header">
            <span id="chatTitle">Chat</span>
            <button onclick="closeChat()" style="background:none; border:none; color:white; cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div id="adminChatMessages" class="chat-window-messages"></div>
        <form id="adminChatForm" class="chat-window-input">
            <input type="text" id="adminMessageInput" placeholder="Resposta..." required style="flex:1; padding:0.5rem; border-radius:15px; border:1px solid var(--border-color);">
            <button type="submit" class="btn btn-primary" style="padding:0.5rem 1rem;">Enviar</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let selectedUserId = null;
        const socket = io();

        async function initAdmin() {
            const res = await fetch('/api/auth/status');
            const data = await res.json();
            if (!data.loggedIn || data.user.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            socket.emit('joinAdmin');
            loadContacts();
            loadUsers();
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadContacts() {
            const res = await fetch('/api/admin/contacts');
            const contacts = await res.json();
            const list = document.getElementById('contactsList');
            list.innerHTML = '';

            contacts.forEach(c => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.innerHTML = `
                    <strong>${escapeHTML(c.name)}</strong> (${escapeHTML(c.email)})<br>
                    <small>${escapeHTML(c.subject)}</small><br>
                    <p style="font-size:0.8rem; margin-top:0.5rem;">${escapeHTML(c.message)}</p>
                `;
                list.appendChild(div);
            });
        }

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = '';

            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'chat-user-item';
                div.innerHTML = `<i class="fas fa-user"></i> ${escapeHTML(u.username)}`;
                div.onclick = () => openChat(u.id, u.username);
                list.appendChild(div);
            });
        }

        function openChat(userId, username) {
            selectedUserId = userId;
            document.getElementById('chatTitle').textContent = `Chat com ${username}`;
            document.getElementById('adminChatWindow').style.display = 'flex';
            socket.emit('join', userId); // Join the user's room to receive/send messages
        }

        function closeChat() {
            document.getElementById('adminChatWindow').style.display = 'none';
        }

        socket.on('messageHistory', (history) => {
            if (selectedUserId) {
                const chatContainer = document.getElementById('adminChatMessages');
                chatContainer.innerHTML = '';
                history.forEach(msg => {
                    const div = document.createElement('div');
                    div.style.alignSelf = msg.is_from_admin ? 'flex-end' : 'flex-start';
                    div.style.background = msg.is_from_admin ? 'var(--primary-color)' : 'var(--bg-color)';
                    div.style.color = msg.is_from_admin ? 'white' : 'var(--text-color)';
                    div.style.padding = '0.5rem 0.8rem';
                    div.style.borderRadius = '10px';
                    div.style.maxWidth = '80%';
                    div.textContent = msg.message;
                    chatContainer.appendChild(div);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });

        socket.on('receiveMessage', (msg) => {
            if (selectedUserId == msg.user_id) {
                const chatContainer = document.getElementById('adminChatMessages');
                const div = document.createElement('div');
                div.style.alignSelf = msg.is_from_admin ? 'flex-end' : 'flex-start';
                div.style.background = msg.is_from_admin ? 'var(--primary-color)' : 'var(--bg-color)';
                div.style.color = msg.is_from_admin ? 'white' : 'var(--text-color)';
                div.style.padding = '0.5rem 0.8rem';
                div.style.borderRadius = '10px';
                div.style.maxWidth = '80%';
                div.textContent = msg.message;
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });

        socket.on('newUserMessage', (msg) => {
            // Optional: alert or highlight user in list
            console.log('New message from user:', msg.user_id);
        });

        document.getElementById('adminChatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('adminMessageInput');
            if (input.value && selectedUserId) {
                socket.emit('sendMessage', {
                    userId: selectedUserId,
                    message: input.value,
                    isAdmin: true
                });
                input.value = '';
            }
        });

        initAdmin();
    </script>
</body>
</html>
