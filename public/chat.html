<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens - David Pereira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">David Pereira</a>
        <div class="auth-buttons">
            <button id="logoutBtn" class="btn btn-outline">Sair</button>
        </div>
    </nav>
    <div class="chat-container">
        <h2>As Minhas Mensagens</h2>
        <div id="adminControls" style="display:none; margin-bottom: 20px;">
            <select id="userSelect" class="form-group">
                <option value="">Selecione um utilizador para responder...</option>
            </select>
        </div>
        <div class="chat-box" id="chatBox">
            <!-- Messages load here -->
        </div>
        <form id="chatForm" class="chat-input">
            <input type="text" id="messageInput" placeholder="Escreva a sua mensagem..." required>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script>
        // Init chat
        document.addEventListener('DOMContentLoaded', () => {
            initChat();
        });
    </script>
</body>
</html>
