<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens em Tempo Real | David Pereira</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">

    <!-- Ambient Visual Effects -->
    <div class="bg-grid-overlay"></div>
    <div class="aurora-orb aurora-1"></div>
    <div class="aurora-orb aurora-2"></div>

    <!-- Top Navigation Bar -->
    <nav class="navbar" style="position:fixed; top:0; width:100%;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon-box">DP</div>
                <div>
                    <span class="gradient-text">David</span> Pereira
                </div>
            </a>

            <div class="nav-actions">
                <button class="theme-toggle-btn" id="themeToggle" aria-label="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="index.html" class="btn btn-secondary btn-sm">
                    <i class="fas fa-home"></i> Início
                </a>
                <button onclick="logout()" class="btn btn-outline btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <!-- Split Chat Application Container -->
    <div class="chat-app-container">
        <!-- Left Sidebar: Profile & Conversation Info -->
        <aside class="chat-sidebar">
            <div class="sidebar-profile">
                <div class="user-avatar-badge" id="currentUserAvatar">U</div>
                <div class="profile-info">
                    <h4 id="currentUsername">Utilizador</h4>
                    <span class="profile-role-badge" id="currentUserRole">Utilizador</span>
                </div>
            </div>

            <div class="sidebar-content">
                <!-- Admin Only User List Container -->
                <div id="adminUserList" style="display:none;">
                    <div class="sidebar-section-title">Utilizadores / Conversas</div>
                    <div id="userItemsList">
                        <!-- Populated by JS for admin -->
                    </div>
                </div>

                <!-- Normal User Conversation Info -->
                <div id="userGeneralInfo">
                    <div class="sidebar-section-title">Canal Direto</div>
                    <div style="background:var(--bg-surface); padding:1.2rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                        <div style="display:flex; align-items:center; gap:0.9rem; margin-bottom:0.9rem;">
                            <div class="user-avatar-badge" style="width:40px; height:40px; font-size:0.95rem; background:var(--gradient-primary);">
                                DP
                            </div>
                            <div>
                                <strong style="font-size:1rem; display:block; color:var(--text-bright);">David Pereira</strong>
                                <span style="font-size:0.78rem; color:var(--accent-emerald); font-weight:600;">
                                    <i class="fas fa-circle" style="font-size:0.5rem;"></i> Administrador Online
                                </span>
                            </div>
                        </div>
                        <p style="font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">
                            Escreva a sua mensagem abaixo. O David receberá a sua notificação em direto via WebSockets!
                        </p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right Main Chat Window -->
        <main class="chat-main-window">
            <header class="chat-header">
                <div class="chat-interlocutor">
                    <div class="user-avatar-badge" style="width:42px; height:42px; font-size:1rem;">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div>
                        <h3 id="interlocutorTitle">Conversa com Suporte</h3>
                        <span class="online-status">
                            <span class="status-dot" style="width:7px; height:7px;"></span>
                            Ligação ativa em tempo real
                        </span>
                    </div>
                </div>
            </header>

            <!-- Message Stream -->
            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>A carregar mensagens...</p>
                </div>
            </div>

            <!-- Input Bar -->
            <footer class="chat-input-bar">
                <form id="chatForm" class="chat-form">
                    <input type="text" id="messageInput" class="chat-input-field" placeholder="Escreva a sua mensagem..." required autocomplete="off">
                    <button type="submit" class="chat-send-btn" aria-label="Enviar Mensagem" title="Enviar Mensagem">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Socket.IO & Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initChat();
        });
    </script>
</body>
</html>
