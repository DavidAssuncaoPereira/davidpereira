<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | David Pereira</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- Ambient Visual Effects -->
    <div class="bg-grid-overlay"></div>
    <div class="aurora-orb aurora-1"></div>
    <div class="aurora-orb aurora-2"></div>

    <div class="auth-wrapper">
        <a href="index.html" class="auth-back-btn">
            <i class="fas fa-arrow-left"></i> Voltar à Página Inicial
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Criar Nova Conta</h2>
                <p>Registe-se para falar diretamente comigo através do chat em tempo real</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Nome de Utilizador</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="reg-username" placeholder="Mínimo 3 caracteres" required minlength="3" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Palavra-passe</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <button type="button" id="reg-togglePassword" class="password-toggle-btn" aria-label="Mostrar ou ocultar palavra-passe">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <p id="reg-errorMsg" style="color:#ef4444; font-size:0.88rem; margin-bottom:1rem; font-weight:600; min-height:1.2rem;"></p>

                <button type="submit" class="btn btn-primary btn-glow">
                    <i class="fas fa-user-plus"></i> Registar Conta
                </button>
            </form>

            <div class="auth-footer">
                <p>Já tem uma conta criada? <a href="login.html">Iniciar sessão aqui</a></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
