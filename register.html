<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - David Pereira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">David Pereira</a>
    </nav>
    <div class="auth-container">
        <h2>Criar Conta</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="reg-username">Nome de Utilizador</label>
                <input type="text" id="reg-username" placeholder="Nome de Utilizador" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Palavra-passe</label>
                <input type="password" id="reg-password" placeholder="Palavra-passe" required>
            </div>
            <button type="submit" class="btn">Registar</button>
            <p class="error-msg" id="reg-errorMsg"></p>
        </form>
        <p>Já tem conta? <a href="login.html">Faça login</a></p>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
