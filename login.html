<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - David Pereira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">David Pereira</a>
    </nav>
    <div class="auth-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nome de Utilizador</label>
                <input type="text" id="username" placeholder="Nome de Utilizador" required>
            </div>
            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" placeholder="Palavra-passe" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
            <p class="error-msg" id="errorMsg"></p>
        </form>
        <p>Não tem conta? <a href="register.html">Registe-se aqui</a></p>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
