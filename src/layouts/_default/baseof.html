<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" class="scroll-smooth">
<head>
    {{ partial "head.html" . }}
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans antialiased">
<!-- Cursor personalizado -->
<div class="cursor-dot" data-cursor-dot></div>
<div class="cursor-outline" data-cursor-outline></div>

<!-- Loading screen -->
<div class="loading-screen fixed inset-0 z-50 bg-white dark:bg-gray-900 flex items-center justify-center">
    <div class="loading-spinner">
        <div class="spinner-circle"></div>
        <span class="loading-text mt-4">David Pereira</span>
    </div>
</div>

<!-- Skip to content -->
<a href="#main-content" class="skip-to-content sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary text-white px-4 py-2 rounded">
    Saltar para conteúdo
</a>

{{ partial "header.html" . }}

<main id="main-content">
    {{ block "main" . }}{{ end }}
</main>

{{ partial "footer.html" . }}

<!-- Back to top -->
<button id="back-to-top" class="fixed bottom-8 right-8 bg-primary text-white p-3 rounded-full shadow-lg hover:bg-primary-dark transition-all opacity-0 invisible z-40">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
    </svg>
</button>

{{ partial "scripts.html" . }}
</body>
</html>
